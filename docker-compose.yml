services:
  projectory:
    # Images published by GitHub Actions: latest (last release), X.Y.Z, X.Y, X, dev (main).
    image: ghcr.io/william-de71/projectory:${PROJECTORY_TAG:-latest}
    container_name: projectory
    ports:
      - "${PROJECTORY_PORT:-3001}:3001"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=${TZ:-Europe/Paris}
    restart: unless-stopped
